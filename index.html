<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juthi's Vocab Library - 100 Days Vocab Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "media", // This ensures it listens to the system's light/dark preference
      };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Outfit:wght@400;500;700;900&display=swap");
      body {
        font-family: "Noto Sans Bengali", "Outfit", sans-serif;
      }
      .animate-fade-in {
        animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      /* Premium Print Styles (Always Light Mode for Printing) */
      @media print {
        body,
        .preview-container,
        div {
          background-color: white !important;
          color: black !important;
        }
        .print-hidden {
          display: none !important;
        }
        .preview-container {
          box-shadow: none !important;
          max-width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
        }
        .page-break {
          page-break-after: always;
          break-after: page;
        }
        .avoid-break {
          page-break-inside: avoid;
          break-inside: avoid;
        }
        .print-bg-force {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
      }
    </style>
  </head>
  <body
    class="text-gray-800 dark:text-gray-200 selection:bg-violet-200 dark:selection:bg-violet-900 bg-[#f4f5f7] dark:bg-gray-900 transition-colors duration-300"
  >
    <nav
      class="bg-gradient-to-r from-violet-800 to-indigo-900 text-white p-4 shadow-lg print-hidden sticky top-0 z-50 flex justify-between items-center"
    >
      <div class="flex items-center space-x-3">
        <div class="bg-white/10 p-2 rounded-lg backdrop-blur-sm">
          <i data-lucide="book-open" class="w-6 h-6 text-violet-100"></i>
        </div>
        <div>
          <div
            class="font-bold text-xl sm:text-2xl tracking-wide flex items-center"
          >
            Juthi's Vocab Library
          </div>
          <div
            class="text-violet-200 text-xs sm:text-sm font-medium tracking-wider opacity-90"
          >
            100 DAYS CHALLENGE
          </div>
        </div>
      </div>
      <div class="flex space-x-3 sm:space-x-4 items-center relative">
        <div
          id="local-status"
          class="text-[10px] sm:text-xs bg-black/20 px-3 py-1.5 rounded-full text-violet-100 hidden md:flex items-center backdrop-blur-sm border border-white/10"
        >
          <i
            data-lucide="check-circle-2"
            class="w-3.5 h-3.5 mr-1.5 text-green-400"
          ></i>
          Auto Saved
        </div>
        <button
          id="btn-back-dashboard"
          class="hidden flex items-center hover:bg-white/20 transition bg-white/10 px-4 py-2 rounded-lg text-sm font-medium backdrop-blur-sm border border-white/10"
          onclick="window.switchView('dashboard')"
        >
          <i data-lucide="arrow-left" class="w-4 h-4 mr-1.5"></i>
          <span class="hidden sm:inline">ফিরে যান</span>
        </button>

        <div class="relative" id="settings-menu-container">
          <button
            id="btn-settings"
            onclick="window.toggleSettings()"
            class="flex items-center hover:bg-white/20 transition bg-transparent p-2 rounded-lg"
            title="সেটিংস ও ব্যাকআপ"
          >
            <i data-lucide="settings" class="w-6 h-6"></i>
          </button>
          <div
            id="settings-dropdown"
            class="hidden absolute right-0 mt-3 w-64 bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-100 dark:border-gray-700 z-[60] overflow-hidden transform origin-top-right transition-all"
          >
            <div
              class="bg-gray-50 dark:bg-gray-900 px-4 py-3 border-b border-gray-100 dark:border-gray-700 flex items-center"
            >
              <i
                data-lucide="database"
                class="w-4 h-4 mr-2 text-violet-500"
              ></i>
              <span
                class="text-xs font-bold text-gray-600 dark:text-gray-300 uppercase tracking-wider"
                >ডেটা ম্যানেজমেন্ট</span
              >
            </div>
            <div class="py-2">
              <label
                class="cursor-pointer flex items-center px-4 py-3 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-violet-50 dark:hover:bg-gray-700 hover:text-violet-700 dark:hover:text-violet-400 transition"
              >
                <i
                  data-lucide="upload-cloud"
                  class="w-4 h-4 mr-3 text-gray-400 dark:text-gray-500"
                ></i>
                ফুল ব্যাকআপ আপলোড
                <input
                  type="file"
                  accept=".json"
                  class="hidden"
                  id="file-import"
                  onchange="window.importData(event)"
                />
              </label>
              <button
                onclick="window.exportData()"
                class="w-full text-left flex items-center px-4 py-3 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-violet-50 dark:hover:bg-gray-700 hover:text-violet-700 dark:hover:text-violet-400 transition"
              >
                <i
                  data-lucide="download-cloud"
                  class="w-4 h-4 mr-3 text-gray-400 dark:text-gray-500"
                ></i>
                ফুল ব্যাকআপ সেভ (Export)
              </button>
              <div
                class="border-t border-gray-100 dark:border-gray-700 my-1 mx-4"
              ></div>
              <label
                class="cursor-pointer flex items-center px-4 py-3 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-violet-50 dark:hover:bg-gray-700 hover:text-violet-700 dark:hover:text-violet-400 transition"
              >
                <i
                  data-lucide="file-plus"
                  class="w-4 h-4 mr-3 text-gray-400 dark:text-gray-500"
                ></i>
                সিঙ্গেল ডে আপলোড
                <input
                  type="file"
                  accept=".json"
                  class="hidden"
                  id="single-day-import"
                  onchange="window.importSingleDay(event)"
                />
              </label>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <main
      class="p-4 sm:p-6 lg:p-8 print:p-0 print:m-0 max-w-7xl mx-auto relative z-0"
    >
      <div
        id="loader"
        class="flex flex-col items-center justify-center h-64 text-violet-600 dark:text-violet-400"
      >
        <i data-lucide="loader-2" class="w-12 h-12 animate-spin mb-4"></i>
        <p class="text-lg font-medium text-gray-800 dark:text-gray-200">
          লোড হচ্ছে...
        </p>
      </div>

      <div id="view-dashboard" class="hidden animate-fade-in">
        <div
          class="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-8 gap-4 bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 transition-colors"
        >
          <div>
            <h1
              class="text-3xl font-black text-gray-800 dark:text-white tracking-tight"
            >
              আপনার লাইব্রেরি
            </h1>
            <p class="text-gray-500 dark:text-gray-400 mt-1 flex items-center">
              <i data-lucide="layers" class="w-4 h-4 mr-1.5"></i> মোট কন্টেন্ট:
              <span
                id="total-days"
                class="font-bold text-violet-600 dark:text-violet-400 ml-1 bg-violet-50 dark:bg-violet-900/30 px-2 py-0.5 rounded-md"
                >0</span
              >
              টি দিন
            </p>
          </div>
          <button
            onclick="window.createNewDay()"
            class="w-full sm:w-auto bg-violet-600 text-white px-7 py-3.5 rounded-xl hover:bg-violet-700 flex items-center justify-center shadow-[0_4px_14px_0_rgba(124,58,237,0.39)] hover:shadow-[0_6px_20px_rgba(124,58,237,0.23)] hover:-translate-y-0.5 transition-all duration-200 font-bold text-base"
          >
            <i data-lucide="plus-circle" class="w-5 h-5 mr-2"></i> নতুন দিন তৈরি
            করুন
          </button>
        </div>

        <div
          id="dashboard-grid"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
        ></div>
      </div>

      <div
        id="view-editor"
        class="hidden animate-fade-in bg-white dark:bg-gray-800 rounded-2xl shadow-sm p-4 sm:p-8 max-w-4xl mx-auto border border-gray-100 dark:border-gray-700 pb-28 relative transition-colors"
      >
        <div
          class="bg-gradient-to-br from-violet-50 to-indigo-50/50 dark:from-gray-900 dark:to-gray-800 p-6 sm:p-8 rounded-2xl border border-violet-100 dark:border-gray-700 mb-8 transition-colors"
        >
          <div
            class="flex flex-col md:flex-row gap-8 items-center md:items-start"
          >
            <div
              class="flex flex-col items-center md:items-start shrink-0 group relative"
            >
              <p
                class="text-xs text-violet-500 dark:text-violet-400 font-bold uppercase tracking-widest mb-2 flex items-center"
              >
                <i data-lucide="calendar" class="w-3.5 h-3.5 mr-1.5"></i> ডে
                নাম্বার
              </p>
              <div
                class="flex items-baseline relative bg-white dark:bg-gray-800 px-4 py-2 rounded-xl shadow-sm border border-violet-100/50 dark:border-gray-600 transition-colors"
              >
                <span
                  class="text-4xl sm:text-5xl font-black text-violet-900 dark:text-violet-300 mr-2"
                  >Day</span
                >
                <input
                  type="number"
                  id="edit-dayNumber"
                  class="text-4xl sm:text-5xl font-black text-violet-600 dark:text-violet-400 bg-transparent w-24 border-b-2 border-dashed border-transparent hover:border-violet-300 focus:border-violet-500 outline-none text-center transition cursor-pointer focus:cursor-text p-0"
                  placeholder="00"
                  oninput="window.updateCurrentDay('dayNumber', this.value)"
                />
              </div>
            </div>
            <div class="w-full">
              <label
                class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2 flex items-center"
              >
                <i
                  data-lucide="quote"
                  class="w-4 h-4 mr-2 text-violet-400 dark:text-violet-500"
                ></i>
                অনুপ্রেরণামূলক উক্তি
                <span
                  class="text-gray-400 dark:text-gray-500 font-normal text-xs ml-2"
                  >(ঐচ্ছিক)</span
                >
              </label>
              <textarea
                id="edit-quote"
                rows="2"
                class="w-full p-4 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 shadow-sm rounded-xl focus:ring-2 focus:ring-violet-200 dark:focus:ring-violet-800 focus:border-violet-500 dark:focus:border-violet-400 outline-none transition text-gray-700 dark:text-gray-200 resize-none leading-relaxed"
                placeholder="যেমন: The secret of getting ahead is getting started..."
                oninput="window.updateCurrentDay('quote', this.value)"
              ></textarea>
            </div>
          </div>
        </div>

        <div class="space-y-8">
          <div id="list-vocabularies"></div>
          <div id="list-prepositions"></div>
          <div id="list-idioms"></div>
          <div id="list-spellings"></div>
          <div id="list-oneWords"></div>
          <div id="list-analogies"></div>

          <div
            class="bg-blue-50/50 dark:bg-gray-800 p-6 rounded-2xl border border-blue-100 dark:border-gray-700 transition-colors"
          >
            <label
              class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-3 flex items-center"
            >
              <i data-lucide="link-2" class="w-5 h-5 mr-2 text-blue-500"></i>
              Google Form Exam Link
              <span
                class="bg-white dark:bg-gray-700 px-2 py-0.5 rounded text-gray-500 dark:text-gray-400 text-xs ml-3 shadow-sm border border-gray-100 dark:border-gray-600"
                >ঐচ্ছিক</span
              >
            </label>
            <input
              type="text"
              id="edit-examLink"
              class="w-full p-3.5 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-200 dark:focus:ring-blue-800 focus:border-blue-500 outline-none transition text-gray-700 dark:text-gray-200"
              placeholder="https://docs.google.com/forms/..."
              oninput="window.updateCurrentDay('examLink', this.value)"
            />
          </div>
        </div>

        <div
          class="fixed bottom-0 left-0 right-0 bg-white/95 dark:bg-gray-900/95 backdrop-blur-md border-t border-gray-200 dark:border-gray-800 p-4 flex justify-between sm:justify-center items-center shadow-[0_-10px_30px_-15px_rgba(0,0,0,0.1)] dark:shadow-[0_-10px_30px_-15px_rgba(0,0,0,0.5)] z-40 print-hidden gap-4 px-4 sm:px-0 transition-colors"
        >
          <button
            onclick="window.switchView('dashboard')"
            class="px-6 py-3 sm:absolute sm:left-8 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 font-bold rounded-xl hover:bg-gray-50 dark:hover:bg-gray-800 transition"
          >
            বাতিল
          </button>
          <button
            onclick="window.saveCurrentDay()"
            class="px-8 py-3 w-full sm:w-auto bg-gray-900 dark:bg-violet-600 text-white font-bold rounded-xl hover:bg-black dark:hover:bg-violet-500 flex items-center justify-center text-lg shadow-xl hover:-translate-y-1 transition-all"
          >
            <i data-lucide="save" class="w-5 h-5 mr-2"></i>
            <span id="save-btn-text">কন্টেন্ট সেভ করুন</span>
          </button>
        </div>
      </div>

      <div id="view-preview" class="hidden">
        <div
          class="max-w-[800px] mx-auto bg-gray-100/50 dark:bg-gray-900 shadow-none sm:shadow-2xl preview-container font-sans relative sm:rounded-2xl overflow-hidden pb-12 transition-colors"
        >
          <div
            class="sticky top-[72px] sm:top-0 bg-white/80 dark:bg-gray-800/80 backdrop-blur-md p-4 border-b dark:border-gray-700 flex justify-between items-center print-hidden z-40 transition-colors"
          >
            <p
              class="font-bold text-gray-500 dark:text-gray-300 flex items-center"
            >
              <i data-lucide="eye" class="w-5 h-5 mr-2"></i> প্রিভিউ মোড
            </p>
            <button
              onclick="window.print()"
              class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl shadow-lg hover:bg-indigo-700 flex items-center font-bold transition hover:-translate-y-0.5"
            >
              <i data-lucide="printer" class="w-5 h-5 mr-2"></i> সেভ PDF /
              প্রিন্ট
            </button>
          </div>
          <div
            id="preview-content"
            class="bg-white dark:bg-gray-800 transition-colors"
          ></div>
        </div>
      </div>
    </main>

    <div
      id="custom-modal"
      class="hidden fixed inset-0 bg-gray-900/60 dark:bg-black/80 backdrop-blur-sm z-[100] flex items-center justify-center print-hidden p-4 transition-opacity"
    >
      <div
        class="bg-white dark:bg-gray-800 rounded-3xl shadow-2xl p-8 max-w-sm w-full animate-fade-in relative transition-colors"
      >
        <div class="text-center mb-6 mt-2">
          <div
            class="w-20 h-20 bg-gray-50 dark:bg-gray-700 rounded-full flex items-center justify-center mx-auto mb-5 shadow-inner"
            id="modal-icon-bg"
          >
            <i
              id="modal-icon"
              data-lucide="alert-circle"
              class="w-10 h-10 text-violet-600 dark:text-violet-400"
            ></i>
          </div>
          <h3
            id="modal-message"
            class="text-xl font-bold text-gray-800 dark:text-white leading-relaxed"
          >
            Message
          </h3>
        </div>
        <div class="flex justify-center gap-3 w-full" id="modal-actions"></div>
      </div>
    </div>

    <script>
      window.appState = { days: [], currentDay: null };

      // --- TEXT TO SPEECH (TTS) FUNCTION ---
      window.speakText = function (text, event) {
        if (event) {
          event.stopPropagation();
          event.preventDefault();
        }
        if (!text) return;

        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();

          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = "en-US";
          utterance.rate = 0.85;
          utterance.pitch = 1;

          window.speechSynthesis.speak(utterance);
        } else {
          window.showModal(
            "alert",
            "দুঃখিত, আপনার ব্রাউজার Text-to-Speech সাপোর্ট করে না।",
          );
        }
      };

      const safeText = (text) => {
        if (!text) return "";
        let cleanText = text
          .replace(/\\([^)]+\\)/g, "")
          .replace(/[^\x00-\x7F]/g, "")
          .trim();
        return cleanText.replace(/'/g, "\\'");
      };

      window.toggleSettings = function () {
        document.getElementById("settings-dropdown").classList.toggle("hidden");
      };

      document.addEventListener("click", function (event) {
        const container = document.getElementById("settings-menu-container");
        const dropdown = document.getElementById("settings-dropdown");
        if (container && dropdown && !container.contains(event.target)) {
          dropdown.classList.add("hidden");
        }
      });

      window.switchView = function (view) {
        const els = {
          dashboard: document.getElementById("view-dashboard"),
          editor: document.getElementById("view-editor"),
          preview: document.getElementById("view-preview"),
          btnBack: document.getElementById("btn-back-dashboard"),
          btnSettings: document.getElementById("btn-settings"),
        };

        Object.values(els).forEach((el) => el && el.classList.add("hidden"));

        if (view === "dashboard") {
          els.dashboard.classList.remove("hidden");
          els.btnSettings.classList.remove("hidden");
          window.speechSynthesis && window.speechSynthesis.cancel();
          window.renderDashboard();
        } else if (view === "editor") {
          els.editor.classList.remove("hidden");
          window.renderEditor();
        } else if (view === "preview") {
          els.preview.classList.remove("hidden");
          els.btnBack.classList.remove("hidden");
          window.renderPreview();
        }

        if (typeof lucide !== "undefined") lucide.createIcons();
        window.scrollTo(0, 0);
      };

      window.saveToLocalStorage = function () {
        try {
          localStorage.setItem(
            "jobAchieverData",
            JSON.stringify(window.appState.days),
          );
        } catch (e) {
          console.error(e);
        }
      };

      window.getNextDayNumber = function () {
        if (window.appState.days.length === 0) return 1;
        const nums = window.appState.days
          .map((d) => parseInt(d.dayNumber))
          .filter((n) => !isNaN(n));
        return nums.length > 0 ? Math.max(...nums) + 1 : 1;
      };

      window.renderDashboard = function () {
        const grid = document.getElementById("dashboard-grid");
        document.getElementById("total-days").innerText =
          window.appState.days.length;
        grid.innerHTML = "";

        const nextDayNum = window.getNextDayNumber();

        if (window.appState.days.length === 0) {
          grid.innerHTML = `
            <div onclick="window.createNewDay()" class="col-span-full bg-violet-50/50 dark:bg-violet-900/20 rounded-3xl border-2 border-dashed border-violet-300 dark:border-violet-700 hover:border-violet-500 dark:hover:border-violet-500 hover:bg-violet-50 dark:hover:bg-violet-900/40 cursor-pointer transition-all flex flex-col items-center justify-center py-28 text-violet-600 dark:text-violet-400 group shadow-sm mt-4">
                <div class="bg-white dark:bg-gray-800 p-6 rounded-full shadow-sm group-hover:shadow-md group-hover:scale-110 transition-all mb-5 text-violet-600 dark:text-violet-400">
                    <i data-lucide="folder-plus" class="w-12 h-12"></i>
                </div>
                <h3 class="font-bold text-2xl text-gray-800 dark:text-gray-100">প্রথম দিন তৈরি করুন</h3>
                <p class="text-gray-500 dark:text-gray-400 mt-2 font-medium">আপনার লাইব্রেরি সম্পূর্ণ খালি। এখান থেকে শুরু করুন।</p>
            </div>`;
        } else {
          const sortedDays = [...window.appState.days].sort(
            (a, b) => parseInt(a.dayNumber) - parseInt(b.dayNumber),
          );

          sortedDays.forEach((day) => {
            const card = document.createElement("div");
            card.className =
              "bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 hover:shadow-xl hover:-translate-y-1 transition-all flex flex-col h-full overflow-hidden group";
            card.innerHTML = `
                <div class="bg-gradient-to-r from-gray-50 to-white dark:from-gray-800 dark:to-gray-700 px-6 py-4 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center">
                    <h2 class="text-2xl font-black text-gray-800 dark:text-white tracking-tight">Day ${day.dayNumber || "?"}</h2>
                    <div class="flex space-x-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="window.editDay('${day.id}')" title="এডিট" class="p-2 text-blue-500 dark:text-blue-400 hover:bg-blue-100 dark:hover:bg-gray-600 rounded-lg transition"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                        <button onclick="window.deleteDay('${day.id}')" title="ডিলিট" class="p-2 text-red-400 dark:text-red-400 hover:bg-red-100 dark:hover:bg-gray-600 hover:text-red-600 dark:hover:text-red-300 rounded-lg transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                </div>
                <div class="p-6 flex-grow flex flex-col">
                    <p class="text-gray-600 dark:text-gray-300 text-sm mb-6 line-clamp-3 italic flex-grow relative leading-relaxed">
                        <i data-lucide="quote" class="w-4 h-4 absolute -top-1 -left-2 text-gray-200 dark:text-gray-600"></i>
                        <span class="ml-4">${day.quote || "কোনো উক্তি যোগ করা হয়নি..."}</span>
                    </p>

      window.getEmptyDay = function () {
        return {
          id: `day-${Date.now()}`,
          dayNumber: "",
          quote: "",
          vocabularies: [],
          prepositions: [],
          idioms: [],
          spellings: [],
          oneWords: [],
          analogies: [],
          examLink: "",

        const nextDayNum = window.getNextDayNumber();
        window.appState.currentDay = window.getEmptyDay();
        window.appState.currentDay.dayNumber = nextDayNum.toString();
        window.appState.currentDay.vocabularies.push({
          word: "",
          meaning: "",
          synonym: "",
          antonym: "",
          example: "",
        });
        document.getElementById("save-btn-text").innerText =
          `Day ${nextDayNum} সেভ করুন`;

        setTimeout(() => {
          const firstInput = document.querySelector(
            '#list-vocabularies input[placeholder="Word"]',
          );
          if (firstInput) firstInput.focus();
        }, 150);
      };

      window.editDay = function (id) {
        const day = window.appState.days.find((d) => d.id === id);
        if (day) {
          window.appState.currentDay = JSON.parse(JSON.stringify(day));
          document.getElementById("save-btn-text").innerText = "আপডেট করুন";
          window.switchView("editor");
        }
      };

      window.previewDay = function (id) {
        const day = window.appState.days.find((d) => d.id === id);
        if (day) {
          window.appState.currentDay = day;
          window.switchView("preview");
        }
      };

      window.deleteDay = function (id) {
        window.showModal(
          "confirm",
          "আপনি কি নিশ্চিত যে এই দিনের সম্পূর্ণ ডেটা ডিলিট করতে চান?",
          () => {
            window.appState.days = window.appState.days.filter(
              (d) => d.id !== id,
            );
            window.saveToLocalStorage();
            window.renderDashboard();
            window.closeModal();
          },
        );
      };

      window.saveCurrentDay = function () {
        const data = window.appState.currentDay;
        const lists = [
          "vocabularies",
          "prepositions",
          "idioms",
          "spellings",
          "oneWords",
          "analogies",
        ];
        lists.forEach((list) => {
          data[list] = data[list].filter((item) =>
            Object.values(item).some((val) => val.trim() !== ""),
          );
        });

        if (!data.dayNumber || data.dayNumber.trim() === "") {
          window.showModal("alert", "দয়া করে ডে নাম্বার (Day Number) লিখুন!");
          return;
        }

        const index = window.appState.days.findIndex((d) => d.id === data.id);
        if (index >= 0) window.appState.days[index] = data;
        else window.appState.days.push(data);

        window.saveToLocalStorage();
        window.switchView("dashboard");

        window.appState.currentDay[field] = value;

                    <h3 class="text-xl font-bold text-gray-900 dark:text-white mr-2">${i.word || ""}</h3>
                    ${i.word ? `<button onclick="window.speakText('${safeText(i.word)}', event)" class="mr-4 p-1.5 text-blue-500 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-gray-700 rounded-full transition-all print-hidden focus:outline-none" title="উচ্চারণ শুনুন"><i data-lucide="volume-2" class="w-4 h-4"></i></button>` : ""}
                    <span class="text-sm font-bold text-blue-700 dark:text-blue-300 bg-blue-50 dark:bg-blue-900/30 px-3 py-1 rounded-md print-bg-force">${i.meaning || ""}</span>
                </div>
                ${
                  i.example
                    ? `<div class="text-gray-600 dark:text-gray-400 ml-5 mt-2 italic text-sm border-l-2 border-gray-200 dark:border-gray-700 pl-3 flex items-center">
                    <span>${i.example}</span>
                    <button onclick="window.speakText('${safeText(i.example)}', event)" class="ml-2 p-1 text-gray-400 dark:text-gray-500 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full transition-all print-hidden shrink-0" title="উচ্চারণ শুনুন"><i data-lucide="volume-2" class="w-3.5 h-3.5"></i></button>
                </div>`
                    : ""
                }
            </div>`,
        );

        html += renderSection(
          "Idioms & Phrases",
          "message-square-quote",
          data.idioms,
          (i) => `
            <div class="avoid-break bg-rose-50/30 dark:bg-rose-900/10 p-6 rounded-2xl border border-rose-100 dark:border-rose-900/30 shadow-sm print-bg-force">
                <div class="flex items-center mb-2">
                    <h3 class="text-xl font-black text-rose-900 dark:text-rose-300">${i.word || ""}</h3>
                    ${i.word ? `<button onclick="window.speakText('${safeText(i.word)}', event)" class="ml-3 p-1.5 text-rose-500 dark:text-rose-400 hover:bg-rose-100 dark:hover:bg-gray-700 rounded-full transition-all print-hidden focus:outline-none" title="উচ্চারণ শুনুন"><i data-lucide="volume-2" class="w-4 h-4"></i></button>` : ""}
                </div>
                <p class="text-base font-bold text-rose-700 dark:text-rose-400 mb-3">${i.meaning || ""}</p>
                ${
                  i.example
                    ? `<div class="flex items-center text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 p-3 rounded-lg border border-rose-50 dark:border-gray-700 text-sm print-bg-force">
                    <span class="italic">" ${i.example} "</span>
                    <button onclick="window.speakText('${safeText(i.example)}', event)" class="ml-auto p-1.5 text-gray-400 dark:text-gray-500 hover:text-rose-600 dark:hover:text-rose-400 hover:bg-rose-50 dark:hover:bg-gray-700 rounded-full transition-all print-hidden shrink-0" title="উচ্চারণ শুনুন"><i data-lucide="volume-2" class="w-4 h-4"></i></button>
                </div>`
                    : ""
                }
            </div>`,
        );

        html += renderSection(
          "Spelling Rules / Tricks",
          "spell-check",
          data.spellings,
          (i) => `
            <div class="avoid-break flex flex-col sm:flex-row items-center justify-between bg-white dark:bg-gray-800 p-5 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm print-bg-force gap-4 mb-4">
                <div class="flex-1 w-full text-center sm:text-right flex flex-col items-center sm:items-end">
                    <span class="text-[10px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest block mb-2">Memory Trick</span>
                    <span class="text-base sm:text-lg font-mono font-bold text-blue-600 dark:text-blue-400 tracking-[0.1em] bg-blue-50 dark:bg-blue-900/30 px-4 py-1.5 rounded-xl border border-blue-100 dark:border-blue-900/50 inline-block print-bg-force">${i.broken || ""}</span>
                </div>
                <div class="bg-gray-50 dark:bg-gray-700 p-2 rounded-full hidden sm:block print-bg-force shrink-0">
                    <i data-lucide="arrow-right" class="w-5 h-5 text-gray-400 dark:text-gray-500"></i>
                </div>
                <div class="bg-gray-50 dark:bg-gray-700 p-1.5 rounded-full sm:hidden print-bg-force shrink-0 my-1">
                    <i data-lucide="arrow-down" class="w-4 h-4 text-gray-400 dark:text-gray-500"></i>
                </div>
                <div class="flex-1 w-full flex flex-col items-center sm:items-start text-center sm:text-left">
                    <span class="text-[10px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest block mb-2">Actual Word</span>
                    <div class="flex items-center justify-center sm:justify-start">
                        <span class="text-lg sm:text-xl font-bold text-green-700 dark:text-green-400">${i.correct || ""}</span>
                        ${i.correct ? `<button onclick="window.speakText('${safeText(i.correct)}', event)" class="ml-2 p-1.5 text-green-600 dark:text-green-400 hover:bg-green-50 dark:hover:bg-gray-700 rounded-full transition-all print-hidden focus:outline-none shrink-0" title="উচ্চারণ শুনুন"><i data-lucide="volume-2" class="w-5 h-5"></i></button>` : ""}
                    </div>
                </div>
            </div>`,
        );

        html += renderSection(
          "One Word Substitution",
          "wrap-text",
          data.oneWords,
          (i) => `
            <div class="avoid-break flex flex-col sm:flex-row sm:items-center bg-white dark:bg-gray-800 p-5 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm print-bg-force gap-4">
                <p class="flex-1 text-gray-700 dark:text-gray-300 font-medium leading-relaxed">${i.phrase || ""}</p>
                <div class="hidden sm:block text-gray-300 dark:text-gray-600"><i data-lucide="arrow-right" class="w-5 h-5"></i></div>
                <div class="bg-indigo-50 dark:bg-indigo-900/30 px-5 py-3 rounded-xl border border-indigo-100 dark:border-indigo-900/50 flex items-center justify-center sm:justify-end print-bg-force shrink-0">
                    <span class="text-xl font-black text-indigo-700 dark:text-indigo-400">${i.word || ""}</span>
                    ${i.word ? `<button onclick="window.speakText('${safeText(i.word)}', event)" class="ml-3 p-1.5 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-100 dark:hover:bg-gray-700 rounded-full transition-all print-hidden focus:outline-none" title="উচ্চারণ শুনুন"><i data-lucide="volume-2" class="w-5 h-5"></i></button>` : ""}
                </div>
            </div>`,
        );

        html += renderSection(
          "Analogies",
          "git-compare",
          data.analogies,
          (i) => `
            <div class="avoid-break bg-white dark:bg-gray-800 p-6 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm print-bg-force mb-4">
                <div class="flex items-center justify-center mb-4">
                    <h3 class="text-2xl font-black text-gray-800 dark:text-white tracking-widest font-mono text-center">${i.relation || ""}</h3>
                    ${i.relation ? `<button onclick="window.speakText('${safeText(i.relation)}', event)" class="ml-3 p-1.5 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 hover:text-gray-800 dark:hover:text-white rounded-full transition-all print-hidden focus:outline-none" title="উচ্চারণ শুনুন"><i data-lucide="volume-2" class="w-5 h-5"></i></button>` : ""}
                </div>
                <div class="bg-gray-50 dark:bg-gray-900 p-4 rounded-xl border border-gray-200 dark:border-gray-700 print-bg-force text-center text-gray-600 dark:text-gray-400 font-medium">
                    ${i.explanation || ""}
                </div>
            </div>`,
        );

        if (data.examLink) {
          html += `
            <div class="page-break min-h-[1050px] print:h-[1100px] bg-gray-50 dark:bg-gray-900 p-12 relative flex flex-col justify-center items-center text-center print-bg-force transition-colors">
                <div class="bg-white dark:bg-gray-800 p-6 rounded-3xl shadow-xl border border-gray-100 dark:border-gray-700 mb-10">
                    <div class="w-64 h-64 bg-gray-50 dark:bg-gray-900 border-2 border-dashed border-gray-300 dark:border-gray-700 rounded-2xl flex flex-col items-center justify-center p-4 relative overflow-hidden group">
                        <i data-lucide="scan-line" class="w-16 h-16 text-gray-300 dark:text-gray-600 mb-2"></i>
                        <p class="text-gray-400 dark:text-gray-500 font-bold text-sm uppercase tracking-widest">Space for QR Code</p>
                    </div>
                </div>
                <h2 class="text-4xl font-black text-gray-800 dark:text-white mb-6 tracking-tight">Test Your Knowledge</h2>
                <p class="text-xl text-gray-500 dark:text-gray-400 mb-8 max-w-md leading-relaxed">
                    Scan the QR code above or visit the link below to participate in today's assessment.
                </p>
                <div class="bg-white dark:bg-gray-800 px-8 py-4 rounded-full shadow-sm border border-gray-200 dark:border-gray-700">
                    <a href="${data.examLink}" target="_blank" class="text-indigo-600 dark:text-indigo-400 font-bold text-lg break-all hover:text-indigo-800 dark:hover:text-indigo-300 transition">${data.examLink}</a>
                </div>
                ${footerLink}
            </div>`;
        }

        document.getElementById("preview-content").innerHTML = html;
        if (typeof lucide !== "undefined") lucide.createIcons();
      };

      // Full Backup & Import Logics
      window.exportData = function () {
        if (window.appState.days.length === 0) {
          window.showModal("alert", "এক্সপোর্ট করার মতো কোনো ডাটা নেই!");
          return;
        }
        const dataStr =
          "data:text/json;charset=utf-8," +
          encodeURIComponent(JSON.stringify(window.appState.days, null, 2));
        const downloadNode = document.createElement("a");
        downloadNode.setAttribute("href", dataStr);
        downloadNode.setAttribute("download", "vocabulary_full_backup.json");
        document.body.appendChild(downloadNode);
        downloadNode.click();
        downloadNode.remove();
        window.toggleSettings();
      };

      window.importData = function (event) {
        const file = event.target.files[0];
        if (!file) return;
        window.toggleSettings();
        const reader = new FileReader();
        reader.readAsText(file, "UTF-8");
        reader.onload = (e) => {
          try {
            const importedDays = JSON.parse(e.target.result);
            if (Array.isArray(importedDays)) {
              window.showModal(
                "confirm",
                "বর্তমান সব ডেটা মুছে নতুন ডেটা বসবে। আপনি কি নিশ্চিত?",
                () => {
                  window.appState.days = importedDays;
                  window.saveToLocalStorage();
                  window.renderDashboard();
                  window.closeModal();
                },
              );
            } else {
              window.showModal("alert", "ভুল ফাইল ফরম্যাট!");
            }
          } catch (error) {
            window.showModal("alert", "ফাইল পড়তে সমস্যা হয়েছে!");
          }
          event.target.value = null;
        };
      };

      window.importSingleDay = function (event) {
        const file = event.target.files[0];
        if (!file) return;
        window.toggleSettings();
        const reader = new FileReader();
        reader.readAsText(file, "UTF-8");
        reader.onload = (e) => {
          try {
            const importedData = JSON.parse(e.target.result);
            let newDay =
              Array.isArray(importedData) && importedData.length > 0
                ? importedData[0]
                : importedData && typeof importedData === "object"
                  ? importedData
                  : null;

            if (newDay && (newDay.id || newDay.dayNumber)) {
              const existingIndex = window.appState.days.findIndex(
                (d) => d.dayNumber === newDay.dayNumber,
              );
              if (existingIndex >= 0) {
                window.showModal(
                  "confirm",
                  `Day-${newDay.dayNumber} এর ডেটা আগে থেকেই আছে। আপডেট করতে চান?`,
                  () => {
                    window.appState.days[existingIndex] = newDay;
                    window.saveToLocalStorage();
                    window.renderDashboard();
                    window.closeModal();
                  },
                );
              } else {
                window.appState.days.push(newDay);
                window.saveToLocalStorage();
                window.renderDashboard();
                window.showModal("alert", `নতুন দিন যোগ হয়েছে!`);
              }
            } else {
              window.showModal("alert", "ভুল ফাইল ফরম্যাট!");
            }
          } catch (error) {
            window.showModal("alert", "ফাইল পড়তে সমস্যা হয়েছে!");
          }
          event.target.value = null;
        };
      };

      window.showModal = function (type, message, onConfirm = null) {
        const modal = document.getElementById("custom-modal");
        const icon = document.getElementById("modal-icon");
        const bg = document.getElementById("modal-icon-bg");
        const msgEl = document.getElementById("modal-message");
        const actions = document.getElementById("modal-actions");

        msgEl.innerText = message;
        actions.innerHTML = "";

        if (type === "confirm") {
          icon.setAttribute("data-lucide", "alert-triangle");
          icon.className = "w-10 h-10 text-orange-500";
          bg.className =
            "w-20 h-20 bg-orange-50 dark:bg-orange-900/30 rounded-full flex items-center justify-center mx-auto mb-5 shadow-inner";
          actions.innerHTML = `
            <button onclick="window.closeModal()" class="flex-1 px-6 py-3.5 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-600 font-bold transition">বাতিল</button>
            <button id="modal-confirm-btn" class="flex-1 px-6 py-3.5 text-white rounded-xl font-bold shadow-lg bg-orange-500 hover:bg-orange-600 hover:-translate-y-0.5 transition-all">নিশ্চিত করুন</button>
          `;
          document.getElementById("modal-confirm-btn").onclick = onConfirm;
        } else {
          icon.setAttribute("data-lucide", "check-circle-2");
          icon.className = "w-10 h-10 text-green-500";
          bg.className =
            "w-20 h-20 bg-green-50 dark:bg-green-900/30 rounded-full flex items-center justify-center mx-auto mb-5 shadow-inner";
          actions.innerHTML = `
            <button onclick="window.closeModal()" class="w-full px-6 py-3.5 text-white rounded-xl font-bold shadow-lg bg-gray-900 dark:bg-violet-600 hover:bg-black dark:hover:bg-violet-500 transition-all">ঠিক আছে</button>
          `;
        }

        if (typeof lucide !== "undefined") lucide.createIcons();
        modal.classList.remove("hidden");
      };

      window.closeModal = function () {
        document.getElementById("custom-modal").classList.add("hidden");
      };

      // Init
      document.addEventListener("DOMContentLoaded", function () {
        if (typeof lucide !== "undefined") lucide.createIcons();
        try {
          const savedData = localStorage.getItem("jobAchieverData");
          if (savedData) {
            const parsedData = JSON.parse(savedData);
            if (Array.isArray(parsedData)) window.appState.days = parsedData;
          }
        } catch (e) {}
        document.getElementById("loader").classList.add("hidden");
        window.switchView("dashboard");
      });
    </script>
  </body>
</html>
