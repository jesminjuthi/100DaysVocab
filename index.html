<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juthi's Vocab Library - 100 Days Vocab Challenge</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap");
      body {
        font-family: "Noto Sans Bengali", sans-serif;
        background-color: #f9fafb;
      }
      .animate-fade-in {
        animation: fadeIn 0.3s ease-in-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      /* Custom Print Styles */
      @media print {
        body {
          background-color: white !important;
        }
        .print-hidden {
          display: none !important;
        }
        .preview-container {
          box-shadow: none !important;
          max-width: 100% !important;
        }
        .page-break {
          page-break-after: always;
          break-after: page;
        }
      }
    </style>
  </head>
  <body class="text-gray-800 selection:bg-violet-200">
    <!-- Navbar -->
    <nav
      class="bg-violet-700 text-white p-4 shadow-md print-hidden sticky top-0 z-50 flex justify-between items-center"
    >
      <div class="flex items-center space-x-2">
        <div class="font-bold text-2xl tracking-wide">
          Juthi's Vocab Library
        </div>
        <div class="text-violet-200 text-sm hidden sm:block">
          | 100 Days Vocab Challenge
        </div>
      </div>
      <div class="flex space-x-4 items-center">
        <div
          id="local-status"
          class="text-xs bg-violet-800 px-3 py-1 rounded-full text-violet-100 flex items-center shadow-sm"
        >
          <i data-lucide="hard-drive" class="w-3 h-3 mr-1"></i> Auto Saved
          (Local)
        </div>
        <button
          id="btn-back-dashboard"
          class="hidden flex items-center hover:text-violet-200 transition bg-violet-800 px-3 py-1 rounded"
          onclick="window.switchView('dashboard')"
        >
          <i data-lucide="arrow-left" class="w-4 h-4 mr-1"></i> ড্যাশবোর্ড
        </button>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="p-4 sm:p-6 print:p-0 print:m-0 max-w-7xl mx-auto">
      <!-- Loader -->
      <div
        id="loader"
        class="flex flex-col items-center justify-center h-64 text-violet-600"
      >
        <i data-lucide="loader-2" class="w-12 h-12 animate-spin mb-4"></i>
        <p class="text-lg font-medium">অ্যাপ লোড হচ্ছে...</p>
      </div>

      <!-- Dashboard View -->
      <div id="view-dashboard" class="hidden animate-fade-in">
        <div
          class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4"
        >
          <h1 class="text-3xl font-bold text-gray-800">
            সকল কন্টেন্ট (<span id="total-days">0</span>)
          </h1>
          <div class="flex flex-wrap justify-center gap-3">
            <label
              class="cursor-pointer bg-white border border-violet-600 text-violet-700 px-4 py-2 rounded-lg hover:bg-violet-50 flex items-center shadow-sm transition"
            >
              <i data-lucide="upload" class="w-4 h-4 mr-2"></i> ব্যাকআপ আপলোড
              <input
                type="file"
                accept=".json"
                class="hidden"
                id="file-import"
                onchange="window.importData(event)"
              />
            </label>
            <button
              onclick="window.exportData()"
              class="bg-white border border-violet-600 text-violet-700 px-4 py-2 rounded-lg hover:bg-violet-50 flex items-center shadow-sm transition"
            >
              <i data-lucide="download" class="w-4 h-4 mr-2"></i> ব্যাকআপ সেভ
            </button>
            <button
              onclick="window.createNewDay()"
              class="bg-violet-600 text-white px-5 py-2 rounded-lg hover:bg-violet-700 flex items-center shadow-md transition transform hover:scale-105"
            >
              <i data-lucide="plus" class="w-5 h-5 mr-2"></i> নতুন দিন যোগ করুন
            </button>
          </div>
        </div>
        <div
          id="dashboard-grid"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
        >
          <!-- Cards will be injected here -->
        </div>
      </div>

      <!-- Editor View -->
      <div
        id="view-editor"
        class="hidden animate-fade-in bg-white rounded-xl shadow-lg p-6 max-w-4xl mx-auto border border-gray-100 pb-24 relative"
      >
        <div class="flex justify-between items-center mb-6 pb-4 border-b">
          <h2 class="text-2xl font-bold text-violet-800">কন্টেন্ট এডিটর</h2>
          <div class="flex space-x-3">
            <button
              onclick="window.switchView('dashboard')"
              class="px-4 py-2 border border-gray-300 rounded hover:bg-gray-100 text-gray-700"
            >
              বাতিল
            </button>
            <button
              onclick="window.saveCurrentDay()"
              class="px-5 py-2 bg-violet-600 text-white rounded hover:bg-violet-700 flex items-center shadow"
            >
              <i data-lucide="save" class="w-4 h-4 mr-2"></i> সেভ করুন
            </button>
          </div>
        </div>

        <div class="space-y-8">
          <!-- Basic Info -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Day Number</label
              >
              <input
                type="number"
                id="edit-dayNumber"
                class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-violet-500 outline-none"
                placeholder="যেমন: 21"
                oninput="window.updateCurrentDay('dayNumber', this.value)"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Inspirational Quote</label
              >
              <input
                type="text"
                id="edit-quote"
                class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-violet-500 outline-none"
                placeholder="উক্তি লিখুন..."
                oninput="window.updateCurrentDay('quote', this.value)"
              />
            </div>
          </div>

          <!-- Dynamic Lists Containers -->
          <div id="list-vocabularies"></div>
          <div id="list-prepositions"></div>
          <div id="list-idioms"></div>
          <div id="list-spellings"></div>
          <div id="list-oneWords"></div>
          <div id="list-analogies"></div>

          <!-- Exam Link -->
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2"
              >Google Form Exam Link</label
            >
            <input
              type="text"
              id="edit-examLink"
              class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-violet-500 outline-none"
              placeholder="https://docs.google.com/forms/..."
              oninput="window.updateCurrentDay('examLink', this.value)"
            />
          </div>
        </div>

        <!-- Floating Save Button -->
        <div
          class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t p-4 flex justify-center shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-40 print-hidden"
        >
          <button
            onclick="window.saveCurrentDay()"
            class="px-8 py-3 bg-violet-600 text-white font-bold rounded-full hover:bg-violet-700 flex items-center text-lg shadow-lg hover:shadow-xl transition transform hover:-translate-y-1"
          >
            <i data-lucide="save" class="w-6 h-6 mr-2"></i> কন্টেন্ট সেভ করুন
          </button>
        </div>
      </div>

      <!-- Preview View -->
      <div id="view-preview" class="hidden">
        <div
          class="max-w-2xl mx-auto bg-white shadow-2xl preview-container text-gray-800 font-sans relative"
        >
          <div
            class="sticky top-[72px] bg-white/90 backdrop-blur-sm p-4 border-b flex justify-end print-hidden z-40 rounded-t-xl"
          >
            <button
              onclick="window.print()"
              class="bg-violet-600 text-white px-5 py-2.5 rounded-lg shadow hover:bg-violet-700 flex items-center font-medium transition"
            >
              <i data-lucide="printer" class="w-5 h-5 mr-2"></i> প্রিন্ট / সেভ
              অ্যাজ পিডিএফ
            </button>
          </div>
          <div id="preview-content">
            
          </div>
        </div>
      </div>
    </main>

    <!-- Custom Modal -->
    <div
      id="custom-modal"
      class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-[100] flex items-center justify-center print-hidden p-4"
    >
      <div
        class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full animate-fade-in relative"
      >
        <button
          onclick="window.closeModal()"
          class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"
        >
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
        <div class="text-center mb-6">
          <i
            id="modal-icon"
            data-lucide="alert-circle"
            class="w-12 h-12 mx-auto mb-4 text-violet-600"
          ></i>
          <h3 id="modal-message" class="text-lg font-bold text-gray-800">
            Message
          </h3>
        </div>
        <div class="flex justify-center gap-3" id="modal-actions">
        </div>
      </div>
    </div>

    <!-- Application Logic -->
    <script>
      // Global State Configuration
      window.appState = {
        days: [],
        currentDay: null,
      };

      // --- GLOBAL FUNCTIONS ---

      window.switchView = function (view) {
        const elDashboard = document.getElementById("view-dashboard");
        const elEditor = document.getElementById("view-editor");
        const elPreview = document.getElementById("view-preview");
        const elBtnBack = document.getElementById("btn-back-dashboard");

        elDashboard.classList.add("hidden");
        elEditor.classList.add("hidden");
        elPreview.classList.add("hidden");
        elBtnBack.classList.remove("hidden");

        if (view === "dashboard") {
          elDashboard.classList.remove("hidden");
          elBtnBack.classList.add("hidden");
          window.renderDashboard();
        } else if (view === "editor") {
          elEditor.classList.remove("hidden");
          window.renderEditor();
        } else if (view === "preview") {
          elPreview.classList.remove("hidden");
          window.renderPreview();
        }

        if (typeof lucide !== "undefined") lucide.createIcons();
        window.scrollTo(0, 0);
      };

      window.saveToLocalStorage = function () {
        try {
          localStorage.setItem(
            "jobAchieverData",
            JSON.stringify(window.appState.days),
          );
        } catch (e) {
          console.error("Local storage write error", e);
          window.showModal("alert", "ডেটা সেভ করতে সমস্যা হয়েছে!");
        }
      };

      window.renderDashboard = function () {
        const grid = document.getElementById("dashboard-grid");
        document.getElementById("total-days").innerText =
          window.appState.days.length;
        grid.innerHTML = "";

        if (window.appState.days.length === 0) {
          grid.innerHTML = `
                    <div class="col-span-full text-center py-20 text-gray-400 bg-white rounded-xl border border-dashed border-gray-300 shadow-sm">
                        <i data-lucide="alert-circle" class="w-12 h-12 mx-auto mb-4 opacity-50"></i>
                        <p class="text-xl">কোনো কন্টেন্ট পাওয়া যায়নি। নতুন কন্টেন্ট তৈরি করুন।</p>
                    </div>`;
        } else {
          const sortedDays = [...window.appState.days].sort(
            (a, b) => parseInt(a.dayNumber) - parseInt(b.dayNumber),
          );

          sortedDays.forEach((day) => {
            const card = document.createElement("div");
            card.className =
              "bg-white rounded-xl shadow-md p-6 border-t-4 border-violet-600 hover:shadow-lg transition flex flex-col h-full";
            card.innerHTML = `
                        <h2 class="text-2xl font-bold text-gray-800 mb-2">Day - ${day.dayNumber || "?"}</h2>
                        <p class="text-gray-500 text-sm mb-4 line-clamp-2 italic flex-grow">${day.quote || "কোনো উক্তি নেই"}</p>
                        <div class="flex justify-between mt-4 border-t pt-4">
                            <button onclick="window.previewDay('${day.id}')" class="text-violet-600 hover:text-violet-800 flex items-center text-sm font-medium">
                                <i data-lucide="eye" class="w-4 h-4 mr-1"></i> প্রিভিউ
                            </button>
                            <div class="flex space-x-3">
                                <button onclick="window.editDay('${day.id}')" class="text-blue-600 hover:text-blue-800 flex items-center text-sm">
                                    <i data-lucide="edit-2" class="w-4 h-4"></i>
                                </button>
                                <button onclick="window.deleteDay('${day.id}')" class="text-red-500 hover:text-red-700 flex items-center text-sm">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    `;
            grid.appendChild(card);
          });
        }
        if (typeof lucide !== "undefined") lucide.createIcons();
      };

      window.getEmptyDay = function () {
        return {
          id: `day-${Date.now()}`,
          dayNumber: "",
          quote: "",
          vocabularies: [],
          prepositions: [],
          idioms: [],
          spellings: [],
          oneWords: [],
          analogies: [],
          examLink: "",
        };
      };

      window.createNewDay = function () {
        window.appState.currentDay = window.getEmptyDay();
        window.switchView("editor");
      };

      window.editDay = function (id) {
        const day = window.appState.days.find((d) => d.id === id);
        if (day) {
          window.appState.currentDay = JSON.parse(JSON.stringify(day));
          window.switchView("editor");
        }
      };

      window.previewDay = function (id) {
        const day = window.appState.days.find((d) => d.id === id);
        if (day) {
          window.appState.currentDay = day;
          window.switchView("preview");
        }
      };

      window.deleteDay = function (id) {
        window.showModal(
          "confirm",
          "আপনি কি নিশ্চিত যে এটি ডিলিট করতে চান?",
          () => {
            window.appState.days = window.appState.days.filter(
              (d) => d.id !== id,
            );
            window.saveToLocalStorage();
            window.renderDashboard();
            window.closeModal();
          },
        );
      };

      window.saveCurrentDay = function () {
        const data = window.appState.currentDay;
        if (!data.dayNumber) {
          window.showModal("alert", "দয়া করে Day Number দিন!");
          return;
        }

        const index = window.appState.days.findIndex((d) => d.id === data.id);
        if (index >= 0) {
          window.appState.days[index] = data;
        } else {
          window.appState.days.push(data);
        }

        window.saveToLocalStorage();
        window.switchView("dashboard");
      };

      window.updateCurrentDay = function (field, value) {
        window.appState.currentDay[field] = value;
      };

      window.updateListItem = function (listName, index, field, value) {
        window.appState.currentDay[listName][index][field] = value;
      };

      window.renderEditor = function () {
        const data = window.appState.currentDay;
        document.getElementById("edit-dayNumber").value = data.dayNumber || "";
        document.getElementById("edit-quote").value = data.quote || "";
        document.getElementById("edit-examLink").value = data.examLink || "";

        window.renderDynamicList(
          "list-vocabularies",
          "Vocabulary",
          "vocabularies",
          data.vocabularies,
          ["word", "meaning", "synonym", "antonym", "example"],
        );
        window.renderDynamicList(
          "list-prepositions",
          "Appropriate Preposition",
          "prepositions",
          data.prepositions,
          ["word", "meaning", "example"],
        );
        window.renderDynamicList(
          "list-idioms",
          "Idioms & Phrase",
          "idioms",
          data.idioms,
          ["word", "meaning", "example"],
        );
        window.renderDynamicList(
          "list-spellings",
          "Spelling",
          "spellings",
          data.spellings,
          ["broken", "correct"],
        );
        window.renderDynamicList(
          "list-oneWords",
          "One Word Substitution",
          "oneWords",
          data.oneWords,
          ["phrase", "word"],
        );
        window.renderDynamicList(
          "list-analogies",
          "Analogy",
          "analogies",
          data.analogies,
          ["relation", "explanation"],
        );
      };

      window.renderDynamicList = function (
        containerId,
        title,
        listName,
        items,
        fields,
      ) {
        const container = document.getElementById(containerId);
        if (!items) items = [];

        let html = `
                <div class="bg-gray-50/50 p-4 rounded-xl border border-gray-200 shadow-sm">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-200 pb-2">
                        <h3 class="font-bold text-lg text-gray-800">${title}</h3>
                        <button onclick="window.addListItem('${listName}', '${fields.join(",")}')" class="text-sm bg-violet-100 text-violet-700 px-3 py-1.5 rounded hover:bg-violet-200 flex items-center font-medium transition">
                            <i data-lucide="plus" class="w-4 h-4 mr-1"></i> যোগ করুন
                        </button>
                    </div>
                    <div class="space-y-3">
            `;

        if (items.length === 0) {
          html += `<p class="text-sm text-gray-400 italic bg-white p-3 rounded border border-dashed border-gray-300 text-center">কোনো ডেটা যোগ করা হয়নি।</p>`;
        } else {
          items.forEach((item, index) => {
            html += `<div class="flex gap-2 items-start bg-white p-3 rounded-lg shadow-sm border border-gray-100 relative group"><div class="flex-1">`;

            if (listName === "vocabularies") {
              html += `
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                <input placeholder="Word" class="p-2 border border-gray-200 rounded w-full outline-none focus:border-violet-400" value="${item.word || ""}" oninput="window.updateListItem('${listName}', ${index}, 'word', this.value)">
                                <input placeholder="Meaning" class="p-2 border border-gray-200 rounded w-full outline-none focus:border-violet-400" value="${item.meaning || ""}" oninput="window.updateListItem('${listName}', ${index}, 'meaning', this.value)">
                                <input placeholder="Synonym" class="p-2 border border-gray-200 rounded w-full outline-none focus:border-violet-400" value="${item.synonym || ""}" oninput="window.updateListItem('${listName}', ${index}, 'synonym', this.value)">
                                <input placeholder="Antonym" class="p-2 border border-gray-200 rounded w-full outline-none focus:border-violet-400" value="${item.antonym || ""}" oninput="window.updateListItem('${listName}', ${index}, 'antonym', this.value)">
                            </div>
                            <input placeholder="Example Sentence" class="p-2 border border-gray-200 rounded w-full mt-2 outline-none focus:border-violet-400" value="${item.example || ""}" oninput="window.updateListItem('${listName}', ${index}, 'example', this.value)">
                        `;
            } else if (["prepositions", "idioms"].includes(listName)) {
              html += `
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                <input placeholder="Phrase/Idiom" class="p-2 border border-gray-200 rounded w-full outline-none focus:border-violet-400" value="${item.word || ""}" oninput="window.updateListItem('${listName}', ${index}, 'word', this.value)">
                                <input placeholder="Meaning" class="p-2 border border-gray-200 rounded w-full outline-none focus:border-violet-400" value="${item.meaning || ""}" oninput="window.updateListItem('${listName}', ${index}, 'meaning', this.value)">
                                <input placeholder="Example" class="p-2 border border-gray-200 rounded w-full outline-none focus:border-violet-400" value="${item.example || ""}" oninput="window.updateListItem('${listName}', ${index}, 'example', this.value)">
                            </div>
                        `;
            } else if (listName === "spellings" || listName === "analogies") {
              html += `
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                <input placeholder="${fields[0]}" class="p-2 border border-gray-200 rounded w-full outline-none focus:border-violet-400" value="${item[fields[0]] || ""}" oninput="window.updateListItem('${listName}', ${index}, '${fields[0]}', this.value)">
                                <input placeholder="${fields[1]}" class="p-2 border border-gray-200 rounded w-full outline-none focus:border-violet-400" value="${item[fields[1]] || ""}" oninput="window.updateListItem('${listName}', ${index}, '${fields[1]}', this.value)">
                            </div>
                        `;
            } else if (listName === "oneWords") {
              html += `
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                <input placeholder="Phrase" class="p-2 border border-gray-200 rounded w-full sm:col-span-2 outline-none focus:border-violet-400" value="${item.phrase || ""}" oninput="window.updateListItem('${listName}', ${index}, 'phrase', this.value)">
                                <input placeholder="Word" class="p-2 border border-gray-200 rounded w-full outline-none focus:border-violet-400" value="${item.word || ""}" oninput="window.updateListItem('${listName}', ${index}, 'word', this.value)">
                            </div>
                        `;
            }

            html += `</div>
                        <button onclick="window.removeListItem('${listName}', ${index})" class="text-gray-400 hover:text-red-500 p-2 rounded-lg hover:bg-red-50 transition">
                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                        </button>
                    </div>`;
          });
        }
        html += `</div></div>`;
        container.innerHTML = html;
        if (typeof lucide !== "undefined") lucide.createIcons();
      };

      window.addListItem = function (listName, fieldsStr) {
        const fields = fieldsStr.split(",");
        const emptyObj = {};
        fields.forEach((f) => (emptyObj[f] = ""));
        if (!window.appState.currentDay[listName])
          window.appState.currentDay[listName] = [];
        window.appState.currentDay[listName].push(emptyObj);
        window.renderEditor();
      };

      window.removeListItem = function (listName, index) {
        window.appState.currentDay[listName].splice(index, 1);
        window.renderEditor();
      };

      window.renderPreview = function () {
        const data = window.appState.currentDay;
        if (!data) return;

        const arrowIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>`;
        const arrowIconLg = `<svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-violet-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>`;

        
        const footerLink = `
                <div class="absolute bottom-8 left-0 w-full text-center">
                    <p class="text-xs text-gray-400 font-medium">Made with <span class="text-red-500 text-sm">❤️</span> Jesmin Juthi</p>
                </div>
            `;

        let html = `
                <!-- Cover Page -->
                <div class="page-break min-h-[1050px] print:h-[1100px] flex flex-col justify-center items-center bg-[#31395c] text-white p-12 text-center relative border-b-8 border-gray-100 print:border-none">
                    <h1 class="text-[8rem] sm:text-9xl font-black mb-12 tracking-tight drop-shadow-lg">Day-${data.dayNumber || "?"}</h1>
                    <p class="text-2xl sm:text-3xl leading-relaxed max-w-lg font-medium px-4">${data.quote || ""}</p>
                    <div class="absolute bottom-12 left-0 w-full text-center">
                        <p class="text-xl font-bold bg-white/20 inline-block px-6 py-2 rounded-full backdrop-blur-sm shadow-sm">Juthi's Vocab Library</p>
                        <p class="text-xs text-violet-100 font-medium opacity-80">Made with <span class="text-red-400 text-sm">❤️</span> Jesmin Juthi</p>
                    </div>
                </div>
            `;

        const addDynamicPage = (title, items, renderItem) => {
          if (!items || items.length === 0) return "";
          let pageHtml = `
                    <div class="page-break min-h-[1050px] print:h-[1100px] bg-white p-8 sm:p-12 relative border-b-8 border-gray-100 flex flex-col">
                        <div class="bg-[#31395c] text-white text-2xl sm:text-3xl font-bold py-4 px-8 inline-block rounded-br-3xl rounded-tl-3xl mb-12 shadow-md self-start">${title}</div>
                        <div class="space-y-10 flex-1 px-2 sm:px-6">
                `;
          items.forEach((item) => {
            pageHtml += `<div class="mb-6">${renderItem(item)}</div>`;
          });

          
          pageHtml += `</div>${footerLink}</div>`;
          return pageHtml;
        };

        html += addDynamicPage(
          "Vocabulary",
          data.vocabularies,
          (i) => `
                <div class="pl-5 border-l-[5px] border-violet-500 rounded-sm">
                    <p class="text-2xl font-bold text-violet-800 mb-3">${i.word || ""} : <span class="text-gray-700 font-normal">${i.meaning || ""}</span></p>
                    <div class="pl-2 space-y-1.5 text-lg text-gray-600">
                        <p><span class="font-semibold text-gray-800">Synonym:</span> ${i.synonym || ""}</p>
                        <p><span class="font-semibold text-gray-800">Antonym:</span> ${i.antonym || ""}</p>
                        ${i.example ? `<p class="text-violet-800 mt-3 bg-violet-50/80 px-4 py-2 rounded-lg inline-block shadow-sm border border-violet-100"><span class="font-semibold">Example:</span> ${i.example}</p>` : ""}
                    </div>
                </div>`,
        );

        html += addDynamicPage(
          "Appropriate Preposition",
          data.prepositions,
          (i) => `
                <div class="pl-5 border-l-[5px] border-indigo-400 rounded-sm">
                    <p class="text-2xl font-bold text-indigo-800 mb-2">${i.word || ""}</p>
                    <div class="pl-2 space-y-2 text-lg text-gray-700">
                        <p><span class="font-semibold text-gray-500 text-sm uppercase tracking-wider bg-gray-100 px-2 py-0.5 rounded mr-2">অর্থ</span> ${i.meaning || ""}</p>
                        ${i.example ? `<p class="text-indigo-800 bg-indigo-50 border-indigo-100 px-4 py-2 border rounded-lg inline-block shadow-sm mt-2"><span class="font-semibold">Example:</span> ${i.example}</p>` : ""}
                    </div>
                </div>`,
        );

        html += addDynamicPage(
          "Idioms & Phrase",
          data.idioms,
          (i) => `
                <div class="pl-5 border-l-[5px] border-rose-400 rounded-sm">
                    <p class="text-2xl font-bold text-rose-800 mb-2">${i.word || ""}</p>
                    <div class="pl-2 space-y-2 text-lg text-gray-700">
                        <p><span class="font-semibold text-gray-500 text-sm uppercase tracking-wider bg-gray-100 px-2 py-0.5 rounded mr-2">অর্থ</span> ${i.meaning || ""}</p>
                        ${i.example ? `<p class="text-rose-800 bg-rose-50 border-rose-100 px-4 py-2 border rounded-lg inline-block shadow-sm mt-2"><span class="font-semibold">Example:</span> ${i.example}</p>` : ""}
                    </div>
                </div>`,
        );

        // Responsive 
        html += addDynamicPage(
          "Spelling",
          data.spellings,
          (i) => `
                <div class="grid grid-cols-1 md:grid-cols-[1fr_auto_1fr] items-center gap-4 md:gap-8 text-xl sm:text-2xl bg-gray-50 p-5 sm:p-6 rounded-xl shadow-sm border border-gray-100">
                    <div class="font-mono text-gray-500 tracking-wider text-center md:text-right break-words">${i.broken || ""}</div>
                    <div class="bg-white p-2 rounded-full shadow-sm mx-auto flex-shrink-0 transform rotate-90 md:rotate-0">${arrowIconLg}</div>
                    <div class="font-bold text-violet-800 text-center md:text-left break-words">${i.correct || ""}</div>
                </div>`,
        );

        // Responsive 
        html += addDynamicPage(
          "One word substitution",
          data.oneWords,
          (i) => `
                <div class="text-xl bg-gray-50/50 p-5 rounded-xl border border-gray-100 shadow-sm">
                    <p class="text-gray-700 mb-3 font-medium">${i.phrase || ""}</p>
                    <div class="inline-flex items-start text-violet-700 font-bold bg-white px-4 py-2 rounded-lg shadow-sm border border-violet-50 max-w-full overflow-hidden break-words">
                        <span class="text-violet-400 mt-1 sm:mt-0 flex-shrink-0">${arrowIcon}</span> 
                        <span class="whitespace-normal flex-1">${i.word || ""}</span>
                    </div>
                </div>`,
        );

        // Responsive 
        html += addDynamicPage(
          "Analogy",
          data.analogies,
          (i) => `
                <div class="text-xl border-b-2 border-gray-100 pb-6 last:border-0">
                    <p class="font-bold text-gray-800 tracking-wide mb-3 text-2xl">${i.relation || ""}</p>
                    <div class="text-violet-700 inline-flex items-start bg-violet-50 px-4 py-2 rounded-lg text-lg border border-violet-100 max-w-full overflow-hidden">
                        <span class="text-violet-500 mt-1 flex-shrink-0">${arrowIcon}</span> 
                        <span class="break-words whitespace-normal">${i.explanation || ""}</span>
                    </div>
                </div>`,
        );

        if (data.examLink) {
          html += `
                <div class="page-break min-h-[1050px] print:h-[1100px] bg-white p-12 relative border-b-8 border-gray-100 flex flex-col justify-center items-center text-center">
                    <h2 class="text-4xl font-bold text-gray-800 mb-8 px-4">Exam দিয়ে নিজের preparation যাচাই করুন-</h2>
                    <div class="w-64 h-64 bg-gray-50 border-4 border-gray-800 rounded-2xl mb-10 flex items-center justify-center p-4 shadow-xl relative overflow-hidden group">
                        <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#000_2px,transparent_2px)] [background-size:16px_16px]"></div>
                        <p class="text-gray-500 font-bold z-10 bg-white px-4 py-2 rounded-lg shadow-md">QR Code Space</p>
                    </div>
                    <p class="text-2xl text-gray-700 mb-6 leading-relaxed">QR code টা scan করুন অথবা নিচের link টাতে ক্লিক<br/>করলেই Exam এ অংশগ্রহণ করতে পারবেন।</p>
                    <a href="${data.examLink}" target="_blank" class="text-blue-600 underline text-lg max-w-lg break-all hover:text-blue-800 transition px-6">${data.examLink}</a>
                    ${footerLink}
                </div>`;
        }


        document.getElementById("preview-content").innerHTML = html;
        if (typeof lucide !== "undefined") lucide.createIcons();
      };

      window.exportData = function () {
        if (window.appState.days.length === 0) {
          window.showModal("alert", "এক্সপোর্ট করার মতো কোনো ডাটা নেই!");
          return;
        }
        const dataStr =
          "data:text/json;charset=utf-8," +
          encodeURIComponent(JSON.stringify(window.appState.days, null, 2));
        const downloadNode = document.createElement("a");
        downloadNode.setAttribute("href", dataStr);
        downloadNode.setAttribute("download", "vocabulary_backup.json");
        document.body.appendChild(downloadNode);
        downloadNode.click();
        downloadNode.remove();
      };

      window.importData = function (event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.readAsText(file, "UTF-8");
        reader.onload = (e) => {
          try {
            const importedDays = JSON.parse(e.target.result);
            if (Array.isArray(importedDays)) {
              window.appState.days = importedDays;
              window.saveToLocalStorage();
              window.renderDashboard();
              window.showModal("alert", "ডেটা সফলভাবে ইমপোর্ট হয়েছে!");
            } else {
              window.showModal("alert", "ভুল ফাইল ফরম্যাট!");
            }
          } catch (error) {
            window.showModal("alert", "ফাইল পড়তে সমস্যা হয়েছে!");
          }
          event.target.value = null;
        };
      };

      window.showModal = function (type, message, onConfirm = null) {
        const modal = document.getElementById("custom-modal");
        const icon = document.getElementById("modal-icon");
        const msgEl = document.getElementById("modal-message");
        const actions = document.getElementById("modal-actions");

        msgEl.innerText = message;
        actions.innerHTML = "";

        if (type === "confirm") {
          icon.setAttribute("data-lucide", "alert-triangle");
          icon.classList.replace("text-violet-600", "text-yellow-500");
          actions.innerHTML = `
                    <button onclick="window.closeModal()" class="px-5 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 font-medium">বাতিল</button>
                    <button id="modal-confirm-btn" class="px-5 py-2 text-white rounded-lg font-medium shadow-md bg-red-500 hover:bg-red-600">নিশ্চিত করুন</button>
                `;
          document.getElementById("modal-confirm-btn").onclick = () => {
            onConfirm();
          };
        } else {
          icon.setAttribute("data-lucide", "check-circle-2");
          icon.classList.replace("text-yellow-500", "text-violet-600");
          actions.innerHTML = `
                    <button onclick="window.closeModal()" class="px-5 py-2 text-white rounded-lg font-medium shadow-md bg-violet-600 hover:bg-violet-700">ঠিক আছে</button>
                `;
        }

        if (typeof lucide !== "undefined") lucide.createIcons();
        modal.classList.remove("hidden");
      };

      window.closeModal = function () {
        document.getElementById("custom-modal").classList.add("hidden");
      };

      // --- APP INITIALIZATION ---
      document.addEventListener("DOMContentLoaded", function () {

        if (typeof lucide !== "undefined") {
          lucide.createIcons();
        }

        // Safe Local Storage Data Load
        try {
          const savedData = localStorage.getItem("jobAchieverData");
          if (savedData) {
            const parsedData = JSON.parse(savedData);
            if (Array.isArray(parsedData)) {
              window.appState.days = parsedData;
            }
          }
        } catch (e) {
          console.error("Local storage read error", e);
        }

        document.getElementById("loader").classList.add("hidden");
        window.switchView("dashboard");
      });
    </script>
  </body>
</html>
